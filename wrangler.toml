name = "sovereigndna-web"
main = "src/worker.js"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

# Map to the flagship subdomain. custom_domain=true makes wrangler provision
# the DNS record + Universal SSL cert automatically on the thebeastagi.com zone.
# (Declared before any [table] headers so TOML keeps it top-level.)
routes = [
  { pattern = "sovereigndna.thebeastagi.com", custom_domain = true }
]

# Static frontend served from ./public via the ASSETS binding.
# Requests that match a static file are served directly; everything else
# (i.e. /api/*) falls through to the Worker in src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Dedicated KV namespace for the waitlist (created 2026-07-16).
[[kv_namespaces]]
binding = "SOVDNA_KV"
id = "16ecad3d5d8b4fb3b327ece7d9db84ca"
